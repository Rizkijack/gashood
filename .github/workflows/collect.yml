# Git-scraping snapshot gas 24 jam untuk GasHood.
#
# Situs = SPA statis: data hanya terkumpul saat browser terbuka. Workflow ini
# menjalankan collector tiap ±5 menit lalu commit hasilnya ke
# data/snapshots.json (rolling 24 jam, ±288 titik) — situs membaca file itu
# saat boot untuk grafik riwayat.
#
# CATATAN CRON: scheduler GitHub Actions bersifat best-effort — eksekusi bisa
# telat beberapa menit saat antrean runner padat, jadi granularitas efektif
# ±5-10 menit. Itu tetap cukup untuk grafik 24 jam.
name: Collect gas snapshots

on:
  schedule:
    # Setiap 5 menit (best-effort — lihat catatan cron di atas).
    - cron: '*/5 * * * *'
  # Tombol manual: Actions → Collect gas snapshots → Run workflow.
  workflow_dispatch:

permissions:
  contents: write # commit + push data/snapshots.json via GITHUB_TOKEN

concurrency:
  group: collect-snapshot
  # Jangan batalkan run yang sedang jalan — biarkan antre (data tetap berurutan).
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # RPC default Robinhood sudah di-hardcode di script; override via env
      # RPC_URL bila perlu (secret/vars repo), tanpa menyentuh kode.
      - name: Collect snapshot
        run: bun scripts/collect-snapshot.ts
        env:
          RPC_URL: ${{ vars.RPC_URL }}

      - name: Commit & push snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshots.json
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan snapshot — skip commit"
          else
            git commit -m "chore(data): snapshot 24j [skip ci]"
            # [skip ci] mencegah workflow lain terpicu oleh commit ini (anti-loop).
            git push
          fi
