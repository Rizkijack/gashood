# Git-scraping snapshot gas 24 jam untuk GasHood.
#
# Situs = SPA statis: data hanya terkumpul saat browser terbuka. Workflow ini
# menjalankan collector lalu commit hasilnya ke data/snapshots.json (destinasi
# rolling 24 jam) — situs membaca file itu saat boot untuk grafik riwayat.
#
# CATATAN CADENCE (jujur): scheduler GitHub Actions free-tier sangat menunda
# jadwal — cron `*/5 * * * *` (5 menit) dalam praktik hanya memicu ~9–10 run/hari
# (gap 95–273 menit). Karena itu cron DIKURANGI ke per-jam (`0 * * * *`) agar
# JADWAL sesuai KENYATAAN; label UI disesuaikan ke "snapshot ±1 jam". Jangan
# naikkan ke 5 menit lagi — scheduler tetap menunda, bukan lebih presisi.
name: Collect gas snapshots

on:
  schedule:
    # Setiap jam (bukan 5 menit — lihat catatan cadence di header workflow).
    # `0 * * * *` = menit 0 tiap jam; scheduler tetap best-effort.
    - cron: '0 * * * *'
  # Tombol manual: Actions → Collect gas snapshots → Run workflow.
  workflow_dispatch:

permissions:
  contents: write # commit + push data/snapshots.json via GITHUB_TOKEN

concurrency:
  group: collect-snapshot
  # Jangan batalkan run yang sedang jalan — biarkan antre (data tetap berurutan).
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # RPC default Robinhood sudah di-hardcode di script; override via env
      # RPC_URL bila perlu (secret/vars repo), tanpa menyentuh kode.
      - name: Collect snapshot
        run: bun scripts/collect-snapshot.ts
        env:
          RPC_URL: ${{ vars.RPC_URL }}

      - name: Commit & push snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshots.json
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan snapshot — skip commit"
          else
            git commit -m "chore(data): snapshot 24j [skip ci]"
            # [skip ci] mencegah workflow lain terpicu oleh commit ini (anti-loop).
            git push
          fi
